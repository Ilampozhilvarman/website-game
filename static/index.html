<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Game</title>
	<script>
		(function () {
			try {
				var saved = localStorage.getItem('theme');
				var theme = saved || (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.dataset.theme = theme;
			} catch (e) {
				document.documentElement.dataset.theme = 'light';
			}
		})();
	</script>
	<link rel="stylesheet" href="style.css">
</head>
<body>
	<header>
		<h1>Game</h1>
	</header>
	<hr class="divider">
	<main>
		<div class="box screen" id="screen-menu" data-screen="menu">
			<h2>Title</h2>
			<hr class="divider">
			<div id="row">
				<button type="button" data-goto="local">On this device</button>
				<button type="button" data-goto="online">On two different devices</button>
			</div>
		</div>
	<div class="box screen" id="screen-local" data-screen="local" hidden>
			<h2>On this device</h2>
			<hr class="divider">
			<p>Local game goes here.</p>
			<button type="button" data-goto="menu">Back</button>
		</div>

		<div class="box screen" id="screen-online" data-screen="online" hidden>
			<h2>On two different devices</h2>
			<hr class="divider">
			<p id="online-status">Online game goes here.</p>
			<button type="button" data-goto="menu">Back</button>
		</div>
	</main>
	<button id="toggle" type="button" aria-label="Toggle dark mode" aria-pressed="false" title="Toggle dark mode">
		<svg class="icon-moon" width="24" height="24" viewBox="0 0 24 24" fill="none"
		   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
			<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
		</svg>
		<svg class="icon-sun" width="24" height="24" viewBox="0 0 24 24" fill="none"
		   stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
			<circle cx="12" cy="12" r="5"></circle>
			<line x1="12" y1="1" x2="12" y2="3"></line>
			<line x1="12" y1="21" x2="12" y2="23"></line>
			<line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
			<line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
			<line x1="1" y1="12" x2="3" y2="12"></line>
			<line x1="21" y1="12" x2="23" y2="12"></line>
			<line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
			<line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
		</svg>
	</button>
	<script src="script.js"></script>
</body>
</html>
